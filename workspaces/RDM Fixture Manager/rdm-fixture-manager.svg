<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="14" fill="#0d1117"/>
  <!-- DMX connector symbol top -->
  <circle cx="50" cy="22" r="14" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="44" cy="19" r="2.5" fill="#3b82f6"/>
  <circle cx="56" cy="19" r="2.5" fill="#3b82f6"/>
  <circle cx="50" cy="26" r="2.5" fill="#3b82f6"/>
  <!-- Fixture body -->
  <rect x="34" y="38" width="32" height="20" rx="4" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <!-- Beam lines -->
  <line x1="50" y1="58" x2="36" y2="80" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  <line x1="50" y1="58" x2="50" y2="82" stroke="#f59e0b" stroke-width="2.5" opacity="0.9"/>
  <line x1="50" y1="58" x2="64" y2="80" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  <!-- RDM text -->
  <text x="50" y="50" font-family="monospace" font-size="9" font-weight="bold" fill="#3b82f6" text-anchor="middle">RDM</text>
  <!-- Status dot -->
  <circle cx="80" cy="20" r="5" fill="#22c55e"/>
</svg>
