name: Build Setup Trigger

on:
  push:
    branches: ["1.1"]
    paths:
      - "docker/setup-trigger/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "1.1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/setup-trigger
          push: true
          tags: ghcr.io/perspective0labs/kasm-setup-trigger:latest
