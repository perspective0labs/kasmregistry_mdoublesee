name: Build grandMA onPC Wine Images

on:
  push:
    branches: ["1.1"]
    paths:
      - ".github/workflows/build-grandma-wine.yml"
      - "docker/grandma-wine/**"
  workflow_dispatch:
    inputs:
      grandma2_version:
        description: "grandMA2 onPC version (malighting.com)"
        required: false
        default: "3.9.63.6"
      grandma3_version:
        description: "grandMA3 onPC version (malighting.com)"
        required: false
        default: "2.4.2.2"
      kasm_base:
        description: "Kasm base image"
        required: false
        default: "kasmweb/kasmos-desktop:1.19.0-rolling-weekly"

concurrency:
  group: build-grandma-wine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: grandma2-onpc
            flavour: "grandMA2 onPC"
            version_input: grandma2_version
            default_version: "3.9.63.6"
          - name: grandma3-onpc
            flavour: "grandMA3 onPC"
            version_input: grandma3_version
            default_version: "2.4.2.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build inputs
        id: vars
        run: |
          if [ "${{ matrix.name }}" = "grandma2-onpc" ]; then
            VERSION="${{ github.event.inputs.grandma2_version || matrix.default_version }}"
          else
            VERSION="${{ github.event.inputs.grandma3_version || matrix.default_version }}"
          fi
          BASE="${{ github.event.inputs.kasm_base || 'kasmweb/kasmos-desktop:1.19.0-rolling-weekly' }}"
          KASM_TAG="$(echo "$BASE" | sed 's/.*://; s/-rolling.*//')"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "base=$BASE"         >> "$GITHUB_OUTPUT"
          echo "kasm_tag=$KASM_TAG" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.flavour }} $VERSION on $BASE"

      - name: Launcher logic tests
        run: bash docker/grandma-wine/test-launcher-logic.sh

      - name: Log in to GHCR
        # grandma2-onpc / grandma3-onpc are pre-existing private GHCR packages
        # that are not linked to this repo, so the ephemeral GITHUB_TOKEN is
        # denied write access ("permission_denied: read_package"). Use a PAT
        # with write:packages when present, falling back to GITHUB_TOKEN.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: docker/grandma-wine
          push: true
          platforms: linux/amd64
          build-args: |
            KASM_BASE=${{ steps.vars.outputs.base }}
            GRANDMA_FLAVOUR=${{ matrix.flavour }}
            GRANDMA_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.vars.outputs.kasm_tag }}
          cache-from: type=gha,scope=grandma-wine
          cache-to: type=gha,mode=max,scope=grandma-wine

      - name: Verify pushed image
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.vars.outputs.version }}"
          docker pull "$IMG"
          docker run --rm --entrypoint bash "$IMG" -lc '
            set -e
            wine --version
            test -x /usr/local/bin/start-grandma-wine.sh
            bash -n /usr/local/bin/start-grandma-wine.sh
            # The Aug-15 images shipped a launcher that sent InnoSetup switches
            # to NSIS installers and picked installers[0] from a folder shared
            # by both flavours. Fail the build if either regression comes back.
            grep -q "installer_kind=\"nsis\"" /usr/local/bin/start-grandma-wine.sh
            grep -q "matches_flavour"        /usr/local/bin/start-grandma-wine.sh
            grep -q "_mac_"                  /usr/local/bin/start-grandma-wine.sh
            ! grep -q "installers\[0\]"      /usr/local/bin/start-grandma-wine.sh
            echo VERIFY_OK'
