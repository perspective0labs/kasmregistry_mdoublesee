name: Build ChamSys MagicQ Kasm Image

on:
  push:
    branches: ["1.1"]
    paths:
      - ".github/workflows/build-magicq.yml"
  workflow_dispatch:
    inputs:
      magicq_version:
        description: "MagicQ version tag (e.g. 1.9.7.4)"
        required: false
        default: "1.9.7.4"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout private docker-builds repo
        uses: actions/checkout@v4
        with:
          repository: perspective0labs/docker-builds
          ssh-key: ${{ secrets.DOCKER_BUILDS_DEPLOY_KEY }}
          path: docker-builds

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download MagicQ Linux .deb from ChamSys
        working-directory: docker-builds/magicq
        run: |
          echo "Logging in to ChamSys..."
          curl -s -c /tmp/mq_cookies.txt \
            -X POST "https://secure.chamsys.co.uk/bugtracker/login.php" \
            -d "username=${{ secrets.CHAMSYS_USER }}&password=${{ secrets.CHAMSYS_PASS }}&perm_login=1" \
            -L -o /tmp/mq_login.html

          echo "Fetching download page for latest stable URL..."
          curl -s -c /tmp/mq_cookies.txt -b /tmp/mq_cookies.txt \
            "https://secure.chamsys.co.uk/mqdownload/" -o /tmp/mq_dl.html

          LINUX_URL=$(grep -oP "https://secure\.chamsys\.co\.uk/bugtracker/download_file\.php\?file_id=0[^']+platform=linux_amd64[^']+" /tmp/mq_dl.html \
            | head -1 | sed 's/&amp;/\&/g')

          echo "Downloading: $LINUX_URL"
          curl -L -c /tmp/mq_cookies.txt -b /tmp/mq_cookies.txt \
            "$LINUX_URL" -o magicq_linux_amd64.deb --progress-bar

          ls -lh magicq_linux_amd64.deb
          file magicq_linux_amd64.deb

      - name: Set version tag
        id: version
        run: echo "tag=${{ github.event.inputs.magicq_version || '1.9.7.4' }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker-builds/magicq
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/magicq-kasm:latest
            ghcr.io/${{ github.repository_owner }}/magicq-kasm:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
