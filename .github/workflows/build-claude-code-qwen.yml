name: Build Claude Code Qwen

on:
  push:
    branches: ["1.1"]
    paths:
      - "docker/claude-code-qwen/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/claude-code-qwen
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-code-qwen:latest
            ghcr.io/${{ github.repository_owner }}/claude-code-qwen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
